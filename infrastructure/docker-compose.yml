version: '3.8'

services:
  db:
    image: timescale/timescaledb-ha:pg15
    container_name: geoscope_db
    environment:
      POSTGRES_USER: geoscope_user
      POSTGRES_PASSWORD: geoscope_password
      POSTGRES_DB: geoscope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  minio:
    image: minio/minio:latest
    container_name: geoscope_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: geoscope_api
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio
    environment:
      - POSTGRES_USER=geoscope_user
      - POSTGRES_PASSWORD=geoscope_password
      - POSTGRES_DB=geoscope
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=False

volumes:
  postgres_data:
  minio_data:
